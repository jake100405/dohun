name: HaruhankanFree
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  HaruhankanFree:
    type: application
    platform: iOS
    sources: [HaruhankanApp.swift, StudyModel.swift, StudyActivity.swift, StudyIntent.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dohun.haruhankan.free
        PRODUCT_NAME: HaruhankanFree
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 하루한칸 Live
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: haruhankan
            CFBundleURLSchemes: [haruhankan-native]
    dependencies:
      - target: HaruhankanWidget
        embed: true
  HaruhankanWidget:
    type: app-extension
    platform: iOS
    sources: [StudyLiveActivity.swift, StudyModel.swift, StudyActivity.swift, StudyIntent.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dohun.haruhankan.free.widget
        PRODUCT_NAME: HaruhankanWidget
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: 하루한칸 공부
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  HaruhankanFree:
    build:
      targets:
        HaruhankanFree: all
