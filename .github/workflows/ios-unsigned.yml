name: Build free iOS trial
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: haruhankan-ios-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Compile simulator targets
        run: xcodebuild -project HaruhankanFree.xcodeproj -scheme HaruhankanFree -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-simulator CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned device app and extension
        run: xcodebuild -project HaruhankanFree.xcodeproj -scheme HaruhankanFree -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build-device/Build/Products/Release-iphoneos/HaruhankanFree.app package/Payload/
          cd package
          zip -qr ../HaruhankanFree-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HaruhankanFree-unsigned
          path: HaruhankanFree-unsigned.ipa
